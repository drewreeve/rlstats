<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replay — RL Stats</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/replay.css">
</head>
<body>
    <div class="noise"></div>

    <div class="replay-shell">
        <header class="replay-bar">
            <a class="replay-back" href="#" data-role="back">&lsaquo; MATCH</a>
            <span class="replay-title" data-role="title">REPLAY</span>
            <span class="replay-score" data-role="score"></span>
            <span class="replay-meta" data-role="meta"></span>
        </header>

        <div class="replay-stage" data-role="stage">
            <canvas data-role="scene"></canvas>
            <div class="replay-countdown" data-role="countdown" hidden></div>
            <div class="replay-cam" data-role="cam">
                <button data-view="broadcast" class="is-active">BROADCAST</button>
                <button data-view="top">TOP</button>
            </div>
            <div class="replay-message" data-role="message" hidden></div>
        </div>

        <div class="replay-controls" data-role="controls" hidden>
            <button class="replay-play" data-role="playpause" aria-label="Play or pause">&#9654;</button>
            <div class="replay-scrub-wrap">
                <input class="replay-scrub" type="range" data-role="scrub" min="0" max="1000" value="0" aria-label="Scrub timeline">
                <div class="replay-marks" data-role="marks"></div>
            </div>
            <span class="replay-clock" data-role="clock">0:00 / 0:00</span>
            <div class="replay-speeds" data-role="speeds">
                <button data-speed="0.5">0.5&times;</button>
                <button data-speed="1" class="is-active">1&times;</button>
                <button data-speed="2">2&times;</button>
                <button data-speed="4">4&times;</button>
            </div>
            <button class="replay-names is-active" data-role="names" aria-pressed="true">NAMES</button>
            <button class="replay-boost is-active" data-role="boost" aria-pressed="true">BOOST</button>
        </div>
    </div>

    <script type="module" src="/static/replay.js"></script>
</body>
</html>
